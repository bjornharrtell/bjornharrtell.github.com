<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eff1f5">
  <meta name="description" content="Björn Harrtell builds software for working with geospatial data.">
  <title>Björn Harrtell</title>
  <style>
    :root { color-scheme:light; --paper:#eff1f5; --ink:#4c4f69; --text:#5c5f77; --quiet:#7c7f93; --rule:#ccd0da; --link:#1e66f5; --link-rule:#a6b5e8; }
    @media(prefers-color-scheme:dark) { :root:not([data-theme="light"]) { color-scheme:dark; --paper:#1e1e2e; --ink:#cdd6f4; --text:#bac2de; --quiet:#9399b2; --rule:#3b3b52; --link:#89b4fa; --link-rule:#566b9c; } }
    :root[data-theme="dark"] { color-scheme:dark; --paper:#1e1e2e; --ink:#cdd6f4; --text:#bac2de; --quiet:#9399b2; --rule:#3b3b52; --link:#89b4fa; --link-rule:#566b9c; }
    :root[data-theme="light"] { color-scheme:light; --paper:#eff1f5; --ink:#4c4f69; --text:#5c5f77; --quiet:#7c7f93; --rule:#ccd0da; --link:#1e66f5; --link-rule:#a6b5e8; }
    * { box-sizing:border-box }
    html { scroll-behavior:smooth }
    body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.72 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; -webkit-font-smoothing:antialiased }
    a { color:var(--link); text-decoration:underline; text-decoration-color:var(--link-rule); text-underline-offset:3px }
    a:hover { text-decoration-color:currentColor }
    a:focus-visible { outline:2px solid var(--link); outline-offset:4px }
    .page { width:min(760px,calc(100% - 48px)); margin:auto }
    .header { display:flex; justify-content:flex-end; gap:24px; padding:38px 0 0; font-size:12px; line-height:1.4 }
    .theme-toggle { display:grid; place-items:center; flex:none; width:30px; height:30px; padding:0; border:1px solid transparent; border-radius:5px; background:transparent; color:var(--quiet); cursor:pointer }
    .theme-toggle:hover { background:var(--rule); color:var(--ink) }
    .theme-toggle:focus-visible { outline:2px solid var(--link); outline-offset:2px }
    .theme-toggle svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round }
    .theme-toggle [hidden] { display:none }
    main { padding:100px 0 112px }
    .overline { margin:0 0 12px; color:var(--quiet); font:600 11px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace; letter-spacing:.13em; text-transform:uppercase }
    h1 { margin:0 0 24px; font-size:clamp(42px,7vw,62px); line-height:1.12; letter-spacing:-.055em; font-weight:650 }
    .intro { max-width:650px; color:var(--text); font-size:19px; line-height:1.66 }
    .intro p { margin:0 0 15px }
    .links { display:flex; flex-wrap:wrap; gap:18px 26px; margin:28px 0 0; padding:0; list-style:none; font-size:13px; font-weight:600 }
    .links a { text-decoration:none; border-bottom:1px solid var(--link-rule) }
    .links a:hover { border-color:currentColor }
    .divider { height:1px; margin:72px 0 62px; background:var(--rule) }
    section + section { margin-top:64px }
    h2 { margin:0 0 20px; font-size:27px; line-height:1.25; letter-spacing:-.035em; font-weight:650 }
    p { margin:0 0 18px }
    .copy { color:var(--text) }
    .minor-list { display:flex; flex-wrap:wrap; gap:7px 18px; margin:22px 0 0; padding:0; list-style:none; font-size:14px }
    .foot { border-top:1px solid var(--rule); padding:22px 0 44px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px; color:var(--quiet); font-size:12px }
    .foot a { color:var(--quiet) }
    @media(max-width:560px) { .page{width:calc(100% - 36px)}.header{padding-top:24px}main{padding:78px 0 82px}.intro{font-size:17px}.divider{margin:55px 0 48px}section + section{margin-top:50px}.project-list li{grid-template-columns:1fr;gap:2px} }
    @media(prefers-reduced-motion:reduce) { html{scroll-behavior:auto} }
  </style>
</head>
<body>
  <div class="page">
    <header class="header">
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Color theme: System. Activate to change." title="Color theme: System">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <g class="icon-system" hidden><rect x="3" y="4" width="18" height="13" rx="2"></rect><path d="M8 21h8m-4-4v4"></path></g>
          <g class="icon-light" hidden><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path></g>
          <path class="icon-dark" d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z" hidden></path>
        </svg>
      </button>
    </header>
    <main id="top"></main>
    <footer class="foot" id="page-footer"></footer>
  </div>
  <script src="main.js?v=3" defer></script>
</body>
</html>
