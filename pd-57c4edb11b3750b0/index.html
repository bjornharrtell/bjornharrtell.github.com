<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pinball Dreams — native port (shell)</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; background: #08080b; color: #d8d8e0;
         font: 14px/1.5 system-ui, sans-serif; display: flex; flex-direction: column;
         align-items: center; gap: 12px; padding: 16px; }
  body:not(.playing):not(.selecting) > #screen, body:not(.playing) > .bar { display: none; }
  canvas { image-rendering: pixelated; background: #000; width: 640px; height: 1084px; }
  body.selecting { justify-content: center; }
  .bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }
  button { background: #24242c; color: inherit; border: 1px solid #3a3a46; border-radius: 6px;
           padding: 6px 12px; font: inherit; cursor: pointer; }
  button:hover { background: #2e2e38; }
  button:focus-visible { outline: 2px solid #f0d060; outline-offset: 3px; }
  code { background: #1c1c22; padding: 1px 5px; border-radius: 4px; }
  .muted { color: #8a8a99; }

  .tables-button { margin-left: 6px; }

  /* Phones: remove every piece of game chrome. The complete 320x542 table is centred in
     the viewport; the shell letterboxes it in black and keeps scanlines source-aligned. */
  @media (max-width: 720px), (pointer: coarse) {
    html, body { width: 100%; height: 100%; }
    body { display: block; padding: 0; overflow: auto; overscroll-behavior: none;
           background: #000; touch-action: auto; }
    body.playing, body.selecting { overflow: hidden; touch-action: none; }
    body.playing #status-bar, body.playing #pack-bar, body.playing #control-bar,
    body.playing #help-bar { display: none; }
    body.playing canvas, body.selecting canvas { position: fixed; inset: 0; display: block; width: 100vw;
             height: 100vh; height: 100dvh; object-fit: contain; object-position: center;
             -webkit-touch-callout: none; user-select: none; }
    /* The initials prompt, over the canvas. */
    #name-entry:not([hidden]) { display: flex; position: fixed; z-index: 6; left: 50%; top: 22%; transform: translateX(-50%);
             flex-direction: column; gap: 8px; padding: 14px 16px; background: #14141acc; border: 1px solid #3a3a46;
             border-radius: 10px; text-align: center; }
    #name-input { font-size: 28px; text-align: center; text-transform: uppercase; width: 5em; letter-spacing: 0.2em; }
  }
  #name-entry[hidden] { display: none; }
</style>
</head>
<body>
  <div class="bar" id="status-bar" aria-label="Game status">
    <span>Score <b id="score">000000000000</b></span>
    <span>Player <b id="player">1</b> / <b id="players">1</b></span>
    <span id="player-scores" title="Scores of all players"></span>
    <span>Ball <b id="ball">1</b> / 3</span>
    <span id="game-state">Preparing the next ball</span>
    <label>Pull <meter id="charge" min="0" max="4096" value="0">0</meter></label>
  </div>
  <form id="name-entry" hidden>
    <label for="name-input">New high score — your initials</label>
    <input id="name-input" maxlength="3" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text">
    <button type="submit">OK</button>
  </form>
  <canvas id="screen" width="640" height="1084"></canvas>

  <div class="bar" id="pack-bar">
    <label class="muted" for="pf">Table pack (optional replacement):</label>
    <input id="pf" type="file" accept=".bin">
    <span class="muted" id="pfnote">optional replacement for the selected table</span>
  </div>

  <div class="bar" id="control-bar">
    <button id="run">Pause</button>
    <button id="step">Step</button>
    <button id="tables" class="tables-button">Tables</button>
    <span class="muted technical">frame <b id="frames">0</b> · hash <code id="hash">—</code> · <b id="fps">0</b> fps · music <b id="audio-underruns">0</b> underruns</span>
  </div>

  <div class="bar muted" id="help-bar">
    <span>Keys: <code>Left Shift</code> left flipper · <code>Right Shift</code> right flipper · <code>Space</code> launch · <code>P</code> pause</span>
  </div>

  <script type="module" src="shell.js?v=20261026-touch-controls"></script>
</body>
</html>
